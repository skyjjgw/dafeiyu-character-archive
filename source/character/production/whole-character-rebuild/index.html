<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整体造型静态审查</title>
<style>body{margin:0;background:#20242b;color:#eef0f4;font:15px system-ui,sans-serif}header,footer{padding:12px 18px}h1{font-size:20px;margin:0 0 5px}p{margin:5px 0;color:#c9cdd5}main{display:grid;grid-template-columns:minmax(320px,1fr) 300px;gap:12px;padding:0 18px}.stage{height:76vh;min-height:430px;position:relative;background:#777b83}canvas{display:block;width:100%;height:100%;touch-action:none}aside img{width:100%;max-height:65vh;object-fit:contain;background:#30343c}nav{display:flex;flex-wrap:wrap;gap:6px;padding:9px 0}button{background:#353c49;color:#eef0f4;border:1px solid #657086;border-radius:3px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#526684}#status{white-space:pre-wrap;color:#e2e6ef}#error{position:absolute;inset:12px;white-space:pre-wrap;background:#351d25;padding:14px;overflow:auto}a{color:#b8d5ff}.small{font-size:12px}@media(max-width:760px){main{grid-template-columns:1fr}aside img{max-height:420px}.stage{height:65vh}}</style>
<script type="importmap">{"imports":{"three":"../rig3d-prototype/vendor/three.module.js"}}</script></head>
<body><header><h1>整体造型建模中，未完成</h1><p>同一原生 master 的可见静态网格审查 · 拖动旋转，滚轮缩放 · 无动作或物理演示</p></header>
<main><section><div class="stage" id="stage"><canvas id="canvas" aria-label="可旋转的未完成整体造型"></canvas><div id="error" hidden></div></div>
<nav aria-label="观察角度"><button data-angle="0" aria-pressed="true">正面</button><button data-angle="45" aria-pressed="false">45°</button><button data-angle="90" aria-pressed="false">侧面</button><button data-angle="180" aria-pressed="false">背面</button><button id="color" aria-pressed="true">彩色</button><button id="clay" aria-pressed="false">灰模</button></nav><p id="status" role="status">正在读取静态 GLB…</p></section>

<script>window.addEventListener('error',e=>{const p=document.getElementById('error');p.hidden=false;p.textContent='审查页错误：'+(e.message||'模块无法载入');});window.addEventListener('unhandledrejection',e=>{const p=document.getElementById('error');p.hidden=false;p.textContent='加载失败：'+String(e.reason?.message||e.reason);});</script><script type="module" src="viewer.mjs"></script></body></html>
