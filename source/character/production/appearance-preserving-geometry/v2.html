<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已选人物 · 头部深度候选 v2</title><link rel="stylesheet" href="review.css"></head>
<body><main><header><div><small>大肥鱼 / 已选外观结构研究</small><h1>保留这张脸，补完整结构</h1><p>同一原画、同一正交相机。Z 体积候选 v2，未替换 v1 或正式页面。候选只修头部；头发和身体仍是原版，侧后视尚未完成。</p></div><span id="status" role="status">正在读取原图与冻结源…</span></header>
<section class="toolbar" aria-label="对照控制"><div class="segmented"><button id="source" type="button">原版结构</button><button id="candidate" type="button" class="selected">头部候选 v2</button></div><label><input type="checkbox" id="isolate"> 只看头部皮肤结构</label><label><input type="checkbox" id="wire"> 网格</label><button id="pixelCompare" type="button">测量正面像素差异</button><button id="capture" type="button">保存当前 PNG</button></section>
<section class="workspace"><div class="viewport"><canvas id="canvas" aria-label="实际几何人物对照"></canvas><div class="caption"><b id="variantLabel">头部候选 v2</b><span id="viewLabel">正面 · 原相机</span></div><p id="error" hidden role="alert"></p></div><aside><h2>检查角度</h2><div class="angles"><button data-view="0" class="selected">正面</button><button data-view="-25">左 25°</button><button data-view="25">右 25°</button><button data-view="-45">左 45°</button><button data-view="45">右 45°</button><button data-view="-90">左 90°</button><button data-view="90">右 90°</button><button data-view="180">背面</button></div><label class="slider">眨眼 <output id="blinkValue">0.00</output><input id="blink" type="range" min="0" max="1" step="0.01" value="0"></label><label class="slider">开口 <output id="talkValue">0.00</output><input id="talk" type="range" min="0" max="1" step="0.01" value="0"></label><label class="slider">视线 <output id="gazeValue">0.00</output><input id="gazeX" type="range" min="-1" max="1" step="0.01" value="0"></label><label class="select">表情 <select id="mood"><option value="neutral">中性</option><option value="happy">开心</option><option value="sad">难过</option></select></label><button id="reset" type="button">重置中性帧</button><h2>实际测量</h2><pre id="stats">等待加载</pre><p class="note">“闭合”仅指网格连接成立，不能代替真实图像审核、碰撞与动作验证。候选保留原虹膜和原画五官，没有采用先前的新脸。</p></aside></section>
<section class="results"><div><h2>原版正面</h2><canvas id="sourceImage" width="320" height="352"></canvas></div><div><h2>候选正面</h2><canvas id="candidateImage" width="320" height="352"></canvas></div><div><h2>差异 × 4</h2><canvas id="differenceImage" width="320" height="352"></canvas></div><pre id="comparison">点击“测量正面像素差异”生成同尺寸实际 WebGL 对照。</pre></section>
<footer>独立结构候选，未替换 4348 页面、已选原画或软件默认人物。当前不是最终全角度角色。</footer></main><script type="module" src="review-v2.mjs"></script></body></html>
