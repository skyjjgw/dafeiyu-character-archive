<style>html,body{margin:0;background:#14201b;color:#e4e8db;font:14px system-ui}main{max-width:1100px;padding:20px;margin:auto}h1{font-size:25px}p{line-height:1.7;color:#bdc8bb}nav,.angles{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,a,select{padding:9px 12px;background:#293f33;color:inherit;border:1px solid #627463;text-decoration:none}button.active{background:#b9c6ac;color:#16201a}canvas{display:block;max-width:100%;height:auto;background:#20352a}label{display:inline-flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:640px 1fr;gap:20px}pre{white-space:pre-wrap;font-size:12px;line-height:1.65}.compare{display:flex;gap:8px;flex-wrap:wrap}.compare img{width:210px;height:231px;background:#20352a}small{color:#adc3ae}@media(max-width:950px){.grid{grid-template-columns:1fr}}</style>
<main><small>大肥鱼 / 独立局部结构候选</small><h1>保留原画，检查裙侧体积</h1><p>只调整原裙子推定的前后深度；脸、发型、身材正面轮廓、原 UV、原画及 22 身体骨不更换。侧背图仍为推定；此页不代表布料物理已完成。</p><nav><button id="source">原版结构</button><button id="candidate" class="active">裙侧体积候选</button><label><input id="body" type="checkbox">只看身体</label><label><input id="skirt" type="checkbox">只看裙子</label><button id="compare">测量正面像素</button><a id="save" download>保存当前 PNG</a></nav><div class="grid"><canvas id="stage" width="640" height="704" aria-label="同机位裙侧体积对照"></canvas><aside><div class="angles"><button data-view="0">正面</button><button data-view="-45">左45°</button><button data-view="45">右45°</button><button data-view="-90">左90°</button><button data-view="90">右90°</button><button data-view="180">背面</button></div><label>推定深度增量 <input id="gain" type="range" min="0" max="1.1" step=".05" value=".85"><output id="gainValue">0.85</output></label><pre id="status">读取冻结原人物…</pre><p>原版本来已有闭合截面。本候选检验它的浅椭圆裙侧是否需要更圆润的钟形体积；未接碰撞和布料模拟，也未替换正式 4348 页面。</p></aside></div><h2>实际正面对照</h2><div class="compare"><img id="sourceImage" alt="原版实际正面"><img id="candidateImage" alt="候选实际正面"><img id="differenceImage" alt="像素差异放大"></div><pre id="comparison">点击测量正面像素。</pre></main><script type="module" src="./review.mjs"></script></html>
