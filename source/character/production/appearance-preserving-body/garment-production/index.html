<main><small>保留 4348 已选人物 / 真实裙布组件</small><h1>同一人物，检查可仿真的裙布结构</h1><p>两层连续中性面、腰固定点、原 22 身体骨和高细节薄壳映射。此页面只展示真实静态结构与原骨架回退；Jolt 动态验证单独进行，当前没有用正弦摆动冒充布料。</p><nav><button id="source">原版裙子</button><button id="component" class="active">裙布组件</button><label><input id="isolate" type="checkbox">只看裙布</label><button id="compare">测量正面对照</button><a id="save" download>保存实际 PNG</a></nav><div class="grid"><canvas id="stage" width="640" height="704" aria-label="实际静态裙布组件"></canvas><aside><nav><button data-view="0">正面</button><button data-view="-45">左45°</button><button data-view="45">右45°</button><button data-view="-90">左90°</button><button data-view="90">右90°</button><button data-view="180">背面</button></nav><pre id="status">验证组件哈希并加载原图…</pre><p>侧背原画连续性和最终自然度仍未通过。低中性面只供物理积分，高壳顶点仅由其三角重心与法线偏移重建；自由物理点没有动画姿势目标。</p></aside></div><div class="results"><img id="sourceImage" alt="原版实际正面"><img id="candidateImage" alt="组件实际正面"><img id="differenceImage" alt="差异放大"></div><pre id="comparison">点击正面对照。</pre></main><script type="module" src="./review.mjs"></script></html>
