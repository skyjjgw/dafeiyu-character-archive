<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已选人物 · 局部手结构候选</title>
<style>html,body{margin:0;background:#182027;color:#dce8ef;font:14px system-ui}main{width:704px;max-width:100vw;margin:auto}header,#digits{display:flex;gap:12px;flex-wrap:wrap;padding:12px 0}label{display:flex;gap:4px;align-items:center}input{width:100px}select{color:inherit;background:#283947;padding:4px;border:1px solid #75909f}canvas{display:block;max-width:100vw;max-height:100vw}p{font-size:12px;color:#aebdca}a{color:#84ceff}body.capture{background:transparent}body.capture header,body.capture #digits,body.capture p,body.capture a{display:none}</style>
<main><header><label>手<select id="side"><option value="left">左</option><option value="right">右</option></select></label><label>视角<select id="view"><option value="0">正面</option><option value="45">3/4</option><option value="90">侧面</option><option value="180">背面</option></select></label><label>画幅<select id="framing"><option value="hand">手部</option><option value="full">整身</option></select></label><label>弯指<input id="grip" type="range" min="0" max="1" step=".01" value="0"></label><label>对掌<input id="opposition" type="range" min="0" max="1" step=".01" value="0"></label></header><div id="digits"></div><div id="stage"></div><p id="status">加载独立局部候选…</p><a id="save" download>保存当前真实 WebGL PNG</a></main><script type="module" src="./review.mjs"></script></html>
