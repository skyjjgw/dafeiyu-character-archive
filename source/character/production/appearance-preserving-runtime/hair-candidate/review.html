<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已选人物 · 头饰局部结构候选</title><style>body{margin:0;background:#16241f;color:#dce9df;font:14px/1.7 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:24px}h1{font-size:24px;margin:0}button,select,input{font:inherit}button,select{background:#294036;color:inherit;border:1px solid #587264;padding:7px 14px;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}#stage{width:min(100%,640px)}canvas{width:100%;height:auto;background:#1b3027}pre{white-space:pre-wrap;font-size:12px}a{color:#a9dbe6}.muted{color:#abbcb2}</style><main><h1>原画头饰，局部补体积</h1><p>原版与候选使用同一人物和原图。候选只改白色褶边的推定深度并补头带两端；没有改默认人物，尚未验收。</p><div class="row"><button id="source">原版</button><button id="candidate">局部候选</button><label>深度强度 <input id="strength" type="range" min="0" max="1" step=".05" value=".55"></label></div><div class="row"><label>视角 <select id="view"><option value="0">正面</option><option value="-25">左25°</option><option value="25">右25°</option><option value="-45">左45°</option><option value="45">右45°</option><option value="-90">左90°</option><option value="90">右90°</option><option value="180">背面</option></select></label><button id="measure">测量正面像素差异</button><a id="save" download="headband-candidate.png">保存当前真实WebGL PNG</a></div><p id="status">加载冻结源人物……</p><div id="stage"></div><pre id="parameters"></pre><pre id="comparison"></pre><div hidden><img id="sourceImage"><img id="candidateImage"></div></main><script type="module" src="review.mjs"></script></html>
